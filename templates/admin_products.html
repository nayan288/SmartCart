{% extends "base.html" %}
{% block content %}
{% include "_admin_nav.html" %}
<div class="row-between"><h1>Products</h1><a class="btn" href="{{ url_for('admin_add_product') }}">Add product</a></div>
<table class="table">
  <tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr>
  {% for p in products %}
  <tr>
    <td>{{ p.id }}</td><td>{{ p.name }}</td><td>{{ p.category or '-' }}</td>
    <td>&#8377;{{ '%.2f'|format(p.price) }}</td><td>{{ p.stock }}</td>
    <td class="actions">
      <a href="{{ url_for('admin_edit_product', pid=p.id) }}">Edit</a>
      <form method="post" action="{{ url_for('admin_delete_product', pid=p.id) }}" onsubmit="return confirm('Delete {{ p.name }}?')"><button class="link-danger" type="submit">Delete</button></form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
