{% extends "base.html" %}
{% block content %}
{% include "_admin_nav.html" %}
<form method="post" enctype="multipart/form-data" class="form narrow">
  <h1>{{ 'Edit product' if p else 'Add product' }}</h1>
  <label>Name <input type="text" name="name" value="{{ p.name if p }}" required></label>
  <label>Description <textarea name="description" rows="4">{{ p.description if p }}</textarea></label>
  <label>Price (&#8377;) <input type="number" step="0.01" min="0" name="price" value="{{ p.price if p }}" required></label>
  <label>Stock <input type="number" min="0" name="stock" value="{{ p.stock if p else 0 }}" required></label>
  <label>Category
    <select name="category_id">
      <option value="">None</option>
      {% for c in categories %}<option value="{{ c.id }}" {{ 'selected' if p and p.category_id == c.id }}>{{ c.name }}</option>{% endfor %}
    </select>
  </label>
  <label>Image <input type="file" name="image" accept="image/*"></label>
  <button class="btn" type="submit">Save product</button>
</form>
{% endblock %}
